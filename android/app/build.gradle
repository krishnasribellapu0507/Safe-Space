apply plugin: 'com.android.application'

android {
    namespace 'com.safespace.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.safespace.app'
        minSdk 23
        targetSdk 35
        versionCode 21
        versionName '2.1.0-hackathon'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    // Deliberately dependency-light for the SIH demo build.
    // Production connectors (Firebase/API client) can be added behind service interfaces.
}
